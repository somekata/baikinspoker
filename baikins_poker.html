<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>バイキンズポーカー | Baikins Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --agar:#F3EEDC;
  --agar-deep:#E9E1C6;
  --ink:#23302A;
  --panel:#FFFCF2;
  --felt:#28473E;
  --felt-deep:#1C342D;
  --gpos:#6E4C9E;
  --gneg:#D8503A;
  --atyp:#3E6FA0;
  --intra:#3E5C9A;
  --afb:#E08A2E;
  --fungi:#1E8F73;
  --gold:#D9A441;
  --line:#D8CFA9;
  --shadow: 0 3px 10px rgba(35,48,42,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 18% 8%, rgba(255,255,255,.5), transparent 45%),
    var(--agar);
  color:var(--ink);
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  min-height:100vh;
  padding:14px;
  -webkit-tap-highlight-color: transparent;
}
.wrap{max-width:980px;margin:0 auto;}

/* ---------- header ---------- */
header.app{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
h1{
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:800;
  font-size:22px;
  margin:0;
  letter-spacing:.02em;
  color:var(--felt-deep);
}
h1 small{
  display:block;
  font-family:'JetBrains Mono',monospace;
  font-weight:400;
  font-size:11px;
  letter-spacing:.12em;
  color:#7C8A78;
  text-transform:uppercase;
  margin-top:2px;
}
.reset-btn{
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:12px; font-weight:700;
  background:var(--panel); border:1.5px solid var(--line); color:var(--ink);
  padding:8px 14px; border-radius:999px; cursor:pointer;
  box-shadow:var(--shadow);
}
.reset-btn:active{transform:translateY(1px);}

/* ---------- tabs ---------- */
.tabs{
  display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;
}
.tab-btn{
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:12.5px;
  background:var(--panel); border:1.5px solid var(--line); color:#566154;
  padding:8px 14px; border-radius:999px; cursor:pointer;
}
.tab-btn.active{background:var(--felt-deep); color:#F4EFD9; border-color:var(--felt-deep);}

/* ---------- explain / yaku / links tab content ---------- */
.doc-section{
  background:var(--panel); border-radius:16px; padding:16px 18px; margin-bottom:12px;
  box-shadow:var(--shadow); border:1.5px solid var(--line);
}
.doc-section h2{
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:15px; margin:0 0 10px;
  color:var(--felt-deep); display:flex; align-items:center; gap:6px;
}
.doc-section p, .doc-section li{font-size:13px; line-height:1.8; color:#3a443c;}
.doc-section ul{margin:6px 0; padding-left:20px;}
.flow-strip{
  display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap;
  margin:10px 0 14px;
}
.flow-step{
  background:var(--agar-deep); border:1.5px solid var(--line); border-radius:12px;
  padding:8px 12px; font-size:12px; font-weight:700; text-align:center;
  font-family:'M PLUS Rounded 1c',sans-serif; color:var(--felt-deep); min-width:80px;
}
.flow-arrow{font-size:16px; color:var(--gold); font-weight:800;}
.threshold-table{width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:12.5px;}
.threshold-table th, .threshold-table td{
  border:1px solid var(--line); padding:7px 8px; text-align:center;
}
.threshold-table th{background:var(--agar-deep); font-family:'M PLUS Rounded 1c',sans-serif; color:var(--felt-deep);}
.seat-ring-wrap{display:flex; justify-content:center; margin:8px 0 14px;}
.glossary-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:8px;}
.glossary-item{
  background:var(--agar-deep); border-radius:12px; padding:9px 11px; border:1px solid var(--line);
}
.glossary-item b{
  display:block; font-family:'M PLUS Rounded 1c',sans-serif; color:var(--gold); font-size:12.5px; margin-bottom:3px;
}
.glossary-item span{font-size:11.5px; color:#4d5b4d; line-height:1.5;}

.yaku-showcase{display:flex; flex-direction:column; gap:10px;}
.yaku-row{
  display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1.5px solid var(--line); border-radius:14px; padding:8px 10px;
  box-shadow:var(--shadow); flex-wrap:wrap;
}
.yaku-row .ylabel{
  flex:0 0 auto; min-width:108px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:12.5px; color:var(--felt-deep);
}
.yaku-row .ypts{
  font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold); font-size:13px; margin-left:2px;
}
.yaku-row .ycards{display:flex; gap:4px; flex-wrap:wrap; flex:1 1 auto;}

.xref-wrap{overflow-x:auto; margin-top:8px;}
.xref-table{border-collapse:collapse; font-size:10.5px; white-space:nowrap;}
.xref-table th, .xref-table td{border:1px solid var(--line); padding:4px 6px; text-align:center;}
.xref-table th{background:var(--agar-deep); font-family:'M PLUS Rounded 1c',sans-serif; color:var(--felt-deep);}
.xref-table td.cardname{
  text-align:left; font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; color:var(--ink);
  position:sticky; left:0; background:var(--panel);
}
.xref-table td.yes{color:var(--gold); font-weight:800;}
.xref-table td.cls{font-size:9.5px; color:#7C8A78;}

.link-grid{display:flex; flex-direction:column; gap:10px;}
.link-card{
  background:var(--panel); border:1.5px solid var(--line); border-radius:16px;
  padding:14px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:6px;
}
.link-card .lname{font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800; font-size:15px; color:var(--felt-deep);}
.link-card .ldesc{font-size:12.5px; color:#4d5b4d; line-height:1.6;}
.link-card .lcat{
  align-self:flex-start; font-size:10px; font-weight:700; color:var(--gold);
  background:var(--agar-deep); padding:2px 9px; border-radius:999px;
}
.link-card .lopen{
  align-self:flex-start; margin-top:4px;
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:12px;
  background:var(--felt-deep); color:#F4EFD9; padding:7px 16px; border-radius:999px;
  text-decoration:none;
}

/* ---------- scoreboard ---------- */
.scoreboard{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  margin-bottom:12px;
}
.score-card{
  background:var(--panel); border-radius:14px; padding:9px 10px;
  box-shadow:var(--shadow); border:1.5px solid var(--line);
  text-align:center; position:relative;
}
.score-card.active{border-color:var(--gold); box-shadow:0 0 0 2px rgba(217,164,65,.35), var(--shadow);}
.score-card .nm{font-size:12px; font-weight:700; color:#566154; font-family:'M PLUS Rounded 1c',sans-serif;}
.score-card .pt{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; color:var(--felt-deep);}
.score-card .tag{font-size:9px; color:var(--gold); font-weight:700; letter-spacing:.05em;}

/* ---------- table ---------- */
.table{
  background:linear-gradient(160deg,var(--felt),var(--felt-deep));
  border-radius:22px;
  padding:14px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 8px 24px rgba(28,52,45,.35);
  display:grid;
  grid-template-rows:auto auto auto;
  gap:8px;
}
.seat-row-top, .seat-row-mid, .seat-row-bottom{display:flex; justify-content:center;}
.seat-row-mid{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;}

.seat{
  text-align:center;
}
.seat .seat-label{
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-size:11px; font-weight:700; color:#E9E9D8;
  margin-bottom:5px; display:flex; align-items:center; justify-content:center; gap:5px;
}
.seat.turn .seat-label{color:var(--gold);}
.seat .seat-label .dot{
  width:7px;height:7px;border-radius:50%;background:var(--gold);
  opacity:0; transition:opacity .2s;
}
.seat.turn .seat-label .dot{opacity:1; box-shadow:0 0 6px var(--gold);}

.cpu-hand{display:flex; gap:-6px; justify-content:center;}
.card-back{
  width:30px; height:42px; border-radius:7px; margin-left:-8px;
  background:repeating-linear-gradient(135deg, #3a5a4f, #3a5a4f 4px, #345349 4px, #345349 8px);
  border:1.5px solid rgba(255,255,255,.18);
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.card-back:first-child{margin-left:0;}

.center-zone{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:6px 8px;
}
.wall-badge{
  font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.07); color:#EFE9CE;
  border:1px dashed rgba(255,255,255,.3);
  border-radius:10px; padding:6px 12px; font-size:12px; text-align:center;
}
.wall-badge b{display:block; font-size:17px;}
.discard-feed{
  display:flex; gap:4px; flex-wrap:wrap; justify-content:center; max-width:230px;
}
.pending-card{
  position:relative;
}
.pending-tag{
  position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  font-size:8px; background:var(--gold); color:#3a2a06; font-weight:700;
  padding:1px 5px; border-radius:6px; white-space:nowrap;
  font-family:'M PLUS Rounded 1c',sans-serif;
}

/* ---------- microbe card ---------- */
.mcard{
  width:64px; min-height:88px;
  background:var(--panel);
  border-radius:11px;
  border:2.5px solid var(--line);
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:0 0 5px;
  position:relative;
  cursor:default;
  transition:transform .12s, box-shadow .12s;
  overflow:hidden;
}
.mcard.small{width:34px; min-height:46px; border-width:2px; border-radius:7px;}
.mcard.clickable{cursor:pointer;}
.mcard.clickable:active{transform:translateY(2px) scale(.98);}
.mcard.clickable:hover{transform:translateY(-3px); box-shadow:0 6px 14px rgba(0,0,0,.18);}
.mcard .art{
  width:100%; aspect-ratio:1/1;
  display:block; flex-shrink:0;
  background:#EDE7D2;
  overflow:hidden;
}
.mcard .art img{width:100%; height:100%; object-fit:cover; object-position:center top; display:block;}
.mcard .art .fallback-icon{
  width:100%; height:100%; display:none; align-items:center; justify-content:center; font-size:22px;
}
.mcard.small .art .fallback-icon{font-size:11px;}
.mcard .nm{
  font-size:8.5px; font-weight:700; line-height:1.15; text-align:center;
  font-family:'M PLUS Rounded 1c',sans-serif;
  color:var(--ink);
  padding:4px 4px 0;
}
.mcard.small .nm{font-size:5.5px; line-height:1.05; padding:2px 2px 0;}
.mcard .latin{
  font-size:6.5px; text-align:center; color:#7C8A78; margin-top:2px; line-height:1.1;
  font-family:'JetBrains Mono',monospace;
  padding:0 4px;
}
.mcard.small .latin{display:none;}
.mcard .latin i{font-style:italic;}

.your-hand{
  display:flex; gap:7px; justify-content:center; flex-wrap:wrap;
  padding:10px 4px 4px;
}
.your-hand .mcard.discardable{outline:2px solid transparent;}
.your-hand .mcard.discardable:hover{outline-color:var(--gneg);}

/* ---------- ring colors ---------- */
.mcard.cls-gpos{border-color:var(--gpos);}
.mcard.cls-gneg{border-color:var(--gneg);}
.mcard.cls-atyp{border-color:var(--atyp);}
.mcard.cls-intra{border-color:var(--intra);}
.mcard.cls-afb{border-color:var(--afb);}
.mcard.cls-fungi{border-color:var(--fungi);}

/* ---------- open(meld) / reach-discard UI ---------- */
.mcard.open-locked{box-shadow:0 0 0 2px var(--gold), var(--shadow); cursor:default;}
.open-badge{
  position:absolute; top:2px; left:2px; z-index:2;
  font-size:7px; background:var(--gold); color:#3a2a06; font-weight:700;
  padding:1px 4px; border-radius:5px; line-height:1.3;
  font-family:'M PLUS Rounded 1c',sans-serif;
}
.mcard.small .open-badge{font-size:6px; padding:0 3px;}
.mcard.dim-disabled{opacity:.35; cursor:not-allowed;}
.mcard.dim-disabled.clickable{cursor:not-allowed;}
.btn.reach-armed{background:rgba(217,164,65,.22); border-color:var(--gold); color:#B8852B;}
.cls-gpos .fallback-icon{background:#EFE6FB; color:var(--gpos);}
.cls-gneg .fallback-icon{background:#FBE6E1; color:var(--gneg);}
.cls-atyp .fallback-icon{background:#E3EEFB; color:var(--atyp);}
.cls-intra .fallback-icon{background:#E4E8FB; color:var(--intra);}
.cls-afb .fallback-icon{background:#FCEDDC; color:var(--afb);}
.cls-fungi .fallback-icon{background:#DEF3EC; color:var(--fungi);}

/* ---------- control panel ---------- */
.util-row{
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:10px;
}
.util-btn{
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:12px;
  background:var(--panel); border:1.5px solid var(--line); color:var(--felt-deep);
  padding:8px 14px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow);
}
.util-btn:disabled{opacity:.4; cursor:not-allowed;}
.util-btn:active:not(:disabled){transform:translateY(1px);}

.modal-overlay{
  position:fixed; inset:0; z-index:55;
  background:rgba(28,52,45,.6);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal-card{
  background:var(--panel); border-radius:20px; padding:18px 18px 16px;
  max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
  box-shadow:0 16px 40px rgba(0,0,0,.4); border:2px solid var(--line);
}
.modal-card h3{
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:16px; margin:0 0 10px;
  color:var(--felt-deep); display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.modal-close{
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:12px;
  background:var(--agar-deep); border:1px solid var(--line); color:var(--felt-deep);
  padding:5px 12px; border-radius:999px; cursor:pointer;
}
.zoom-grid{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:10px;}
.zoom-card-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
.zoom-card-wrap .mcard{width:88px; min-height:122px; cursor:pointer;}
.zoom-card-wrap .mcard .nm{font-size:11px;}
.zoom-card-wrap .mcard .latin{font-size:8.5px;}
.zoom-info{
  background:var(--agar-deep); border-radius:12px; padding:10px 12px; font-size:12.5px;
  line-height:1.7; color:#3a443c; min-height:20px;
}
.zoom-info b{color:var(--felt-deep);}
.advice-line{font-size:13.5px; line-height:1.9; color:#3a443c;}
.advice-line b{color:var(--felt-deep);}
.advice-highlight{
  background:var(--agar-deep); border-radius:12px; padding:10px 12px; margin:8px 0;
}

.controls{
  background:var(--panel); border-radius:16px; padding:12px 14px;
  margin-top:12px; box-shadow:var(--shadow); border:1.5px solid var(--line);
}
.msg{
  font-size:13.5px; font-weight:500; color:var(--felt-deep);
  margin-bottom:10px; line-height:1.5;
  font-family:'M PLUS Rounded 1c',sans-serif;
}
.msg .win{color:#B8852B; font-weight:800;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.btn{
  font-family:'M PLUS Rounded 1c',sans-serif;
  font-weight:700; font-size:13px;
  padding:10px 16px; border-radius:12px; border:none; cursor:pointer;
  box-shadow:var(--shadow);
}
.btn-primary{background:var(--felt-deep); color:#F4EFD9;}
.btn-gold{background:var(--gold); color:#3a2a06;}
.btn-outline{background:#fff; color:var(--felt-deep); border:1.5px solid var(--line);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn:active:not(:disabled){transform:translateY(1px);}

/* ---------- log & yaku ---------- */
.lower-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
@media(max-width:680px){.lower-grid{grid-template-columns:1fr;}}
.panel{
  background:var(--panel); border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); border:1.5px solid var(--line);
}
.panel h2{
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:13px; margin:0 0 8px;
  color:var(--felt-deep); display:flex; align-items:center; gap:6px;
}
.log-list{list-style:none; margin:0; padding:0; max-height:170px; overflow-y:auto; font-size:12px;}
.log-list li{padding:5px 0; border-bottom:1px dashed var(--line); color:#4d5b4d;}
.log-list li:last-child{border-bottom:none; color:var(--ink); font-weight:700;}
.yaku-list{list-style:none; margin:0; padding:0; max-height:170px; overflow-y:auto;}
.yaku-list li{
  display:flex; justify-content:space-between; font-size:12px; padding:5px 2px;
  border-bottom:1px dashed var(--line);
}
.yaku-list li:last-child{border-bottom:none;}
.yaku-list b{font-family:'JetBrains Mono',monospace; color:var(--gold);}

/* ---------- footer ---------- */
footer.disclaimer{
  margin-top:16px; padding:12px 14px; font-size:10.5px; line-height:1.6;
  color:#6b7569; background:var(--agar-deep); border-radius:12px; border:1px solid var(--line);
}

@media(max-width:520px){
  .mcard{width:54px; min-height:76px;}
  .mcard .nm{font-size:7.5px;}
}
/* ---------- popup overlay ---------- */
.popup-overlay{
  position:fixed; inset:0; z-index:60;
  background:rgba(28,52,45,.6);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  animation:popupFade .15s ease;
}
.popup-card{
  background:var(--panel); border-radius:22px; padding:30px 40px;
  text-align:center; max-width:92vw;
  box-shadow:0 16px 40px rgba(0,0,0,.4);
  border:3px solid var(--gold);
  animation:popupPop .4s cubic-bezier(.34,1.56,.64,1);
}
.popup-card .ptitle{
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:800;
  font-size:clamp(26px,7vw,40px); color:var(--felt-deep); margin-bottom:6px; line-height:1.2;
}
.popup-card .psub{
  font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700;
  font-size:clamp(16px,4.5vw,22px); color:#B8852B; margin-bottom:4px;
}
.popup-card .pdetail{
  font-family:'JetBrains Mono',monospace; font-size:clamp(13px,3.6vw,16px); color:#566154; margin-top:4px;
}
.standings-list{margin-top:12px; display:inline-block; text-align:left;}
.standings-list .srow{
  display:flex; justify-content:space-between; gap:24px;
  font-family:'JetBrains Mono',monospace; font-size:clamp(13px,3.8vw,16px);
  padding:4px 2px; border-bottom:1px dashed var(--line);
}
.standings-list .srow:last-child{border-bottom:none;}
.standings-list .srow .rk{font-weight:700; color:var(--gold); margin-right:8px;}
.intro-desc{
  font-size:13.5px; font-weight:500; color:#3a443c; line-height:1.8; text-align:left;
  margin-top:10px;
}
.popup-card{max-height:88vh; overflow-y:auto;}
.settings-list{margin-top:10px; text-align:left;}
.setting-group{margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed var(--line);}
.setting-group:last-child{border-bottom:none; margin-bottom:0;}
.setting-label{font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:13.5px; color:var(--felt-deep); margin-bottom:6px;}
.setting-opts{display:flex; gap:6px; flex-wrap:wrap;}
.setting-opt{
  font-family:'M PLUS Rounded 1c',sans-serif; font-size:12px; font-weight:600;
  padding:7px 12px; border-radius:16px; border:1.5px solid var(--line);
  background:var(--panel); color:#566154; cursor:pointer;
  transition:all .12s;
}
.setting-opt:hover{border-color:var(--gold);}
.setting-opt.active{background:var(--gold); border-color:var(--gold); color:#3a2a06;}
.setting-desc{font-size:11px; color:#7C8A78; margin-top:6px; line-height:1.5;}
@keyframes popupFade{from{opacity:0;} to{opacity:1;}}
@keyframes popupPop{0%{transform:scale(.55); opacity:0;} 100%{transform:scale(1); opacity:1;}}

</style>
</head>
<body>
<div class="wrap">

  <header class="app">

const PLAYER_NAMES = ["あなた","CPU①","CPU②","CPU③"];

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function latinHtml(parts){
  return parts.map(p=> p.italic ? `<i>${p.text}</i>` : p.text).join(' ');
}

function cardHtml(card, opts={}){
  const small = opts.small? ' small':'';
  const clickable = opts.clickable? ' clickable discardable':'';
  const openCls = opts.openLocked? ' open-locked':'';
  const dimCls = opts.dim? ' dim-disabled':'';
  const onclick = opts.onclick? ` onclick="${opts.onclick}"`:'';
  const titleText = opts.titleOverride? opts.titleOverride : card.classification;
  return `<div class="mcard cls-${card.classKey}${small}${clickable}${openCls}${dimCls}"${onclick} title="${titleText}">
    ${opts.openLocked? '<div class="open-badge">🔓晒</div>':''}
    <div class="art"><img src="${card.img}" alt="${card.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="fallback-icon">${card.icon}</span></div>
    <div class="nm">${card.name}</div>
    ${opts.small? '' : `<div class="latin">${latinHtml(card.latin)}</div>`}
  </div>`;
}

/* ---------------- yaku check ---------------- */
function bestTarget(cards){
  let best=null;
  YAKU.forEach(y=>{
    const cnt = cards.filter(c=>c.tags.includes(y.key)).length;
    if(!best || cnt>best.cnt || (cnt===best.cnt && y.pts>best.pts)){
      best = {key:y.key, cnt, pts:y.pts, label:y.label};
    }
  });
  return best;
}
// 5枚の手札について、「一致枚数が一番多い役」だけでなく、テンパイ（4枚一致）になっている役を全て探す。
// （オール肺感染のように一致しやすい役が同時に完成していても、他のレアな役がテンパイならそちらも見逃さないようにするため）
function tenpaiYakuList(cards){
  return YAKU
    .map(y => ({key:y.key, label:y.label, pts:y.pts, cnt: cards.filter(c=>c.tags.includes(y.key)).length}))
    .filter(y => y.cnt===4)
    .sort((a,b)=> b.pts-a.pts);
}
function achievedYaku(hand){
  return YAKU.filter(y => hand.length===5 && hand.every(c=>c.tags.includes(y.key)));
}
function lapThreshold(lap){
  if(App.settings && App.settings.lapThresholdEnabled===false) return 0;
  if(lap<=1) return 50;
  if(lap===2) return 30;
  if(lap===3) return 20;
  return 0;
}
function lapThresholdLabel(lap){
  const t = lapThreshold(lap);
  return t>0 ? `${lap}巡目（${t}CFU以上で上がり可）` : `${lap}巡目以降（役があれば上がり可）`;
}

function buildYakuHtml(){
  const sorted = YAKU.slice().sort((a,b)=>b.pts-a.pts);
  const rows = sorted.map(y=>{
    const examples = CARDS.filter(c=>c.tags.includes(y.key)).slice(0,5);
    const cardsHtml = examples.map(c=>cardHtml(c,{small:true})).join('');
    return `<div class="yaku-row">
      <div class="ylabel">${y.label}<br><span class="ypts">${y.pts}CFU</span></div>
      <div class="ycards">${cardsHtml}</div>
    </div>`;
  }).join('');

  const xrefHeader = `<tr><th>カード</th><th>分類</th>${sorted.map(y=>`<th>${y.label.replace('オール','')}</th>`).join('')}</tr>`;
  const xrefRows = CARDS.map(c=>{
    const cells = sorted.map(y=> c.tags.includes(y.key)? `<td class="yes">●</td>` : `<td></td>`).join('');
    return `<tr><td class="cardname">${c.name}</td><td class="cls">${c.classification}</td>${cells}</tr>`;
  }).join('');

  return `
  <div class="doc-section">
    <h2>🏆 役と点数</h2>
    <p>手札5枚すべてが同じタグを持っていれば、その役が成立します。点数が高いほど、早い巡目（1〜3巡目）でもあがりやすくなります。各役の例として、該当するキャラクターを最大5体表示しています。</p>
    <div class="yaku-showcase">${rows}</div>
  </div>

  <div class="doc-section">
    <h2>📋 32キャラクター × 役 対応表</h2>
    <p>横にスクロールできます。●が付いている役に、そのキャラクターが含まれます。</p>
    <div class="xref-wrap">
      <table class="xref-table">${xrefHeader}${xrefRows}</table>
    </div>
  </div>`;
}

const App = {

  wall:[],
  pending:null,        // {card, by}
  discardLog:[],        // {card, by} archive for feed

  reachArmed:false,        // 「リーチして捨てる」モードがONか（捨てる瞬間にリーチ宣言するためのトグル）
  pendingReachChoice:null, // {cardId, options} 複数の役が同時にテンパイになる場合の選択待ち状態
  roundsPlayed:0,           // 終了したラウンド数（安全装置用）
  gameOver:false,
  gameOverReason:null,
  settings:null,            // 確定済みのゲーム設定（defaultSettings()参照）
  pendingSettings:null,     // 設定画面で選択中（未確定）の内容
  popup:null,             // 現在表示中のポップアップHTML（null=非表示）
  oya:0,                  // 親（その局の開始プレイヤー）のインデックス
  lastDraw:[null,null,null,null],  // 各プレイヤーの直近の取得元 'wall'=山から(ツモ) / 'tsurikin'=釣菌
  lastRoundResult:undefined,        // 直前ラウンドの結果（勝者index / 'draw' / undefined=初回）
  ronOffer:null,          // {card, discarderIdx, resumeFn, rest} リーチ中の遠隔釣菌オファー
  zoomOpen:false,         // 拡大表示モーダルの開閉
  zoomSelectedId:null,    // 拡大表示で選択中のカードid
  adviceUsedThisRound:false, // アドバイスを今ラウンド使ったか
  adviceData:null,        // 表示中のアドバイス内容
  adviceOpen:false,       // アドバイスモーダルの開閉
  redealUsedThisRound:false, // 親が配り直しを使ったか
  phase:'idle',         // awaitAction | awaitDiscard | postDiscard | roundEnd | gameOver
  log:[],
  roundOver:false,
  activeTab:'play',
  tabsBuilt:{explain:false, yaku:false, links:false},

  setTab(tab){
    this.activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===tab);
    });
    ['play','explain','yaku','links'].forEach(t=>{
      const el = document.getElementById('tab-'+t);
      if(el) el.style.display = (t===tab? '' : 'none');
    });
    if(tab==='explain' && !this.tabsBuilt.explain){
      document.getElementById('tab-explain').innerHTML = buildExplainHtml();
      this.tabsBuilt.explain = true;
    }
    if(tab==='yaku' && !this.tabsBuilt.yaku){
      document.getElementById('tab-yaku').innerHTML = buildYakuHtml();
      this.tabsBuilt.yaku = true;
    }
    if(tab==='links' && !this.tabsBuilt.links){
      document.getElementById('tab-links').innerHTML = buildLinksHtml();
      this.tabsBuilt.links = true;
    }
  },

  showIntro(){
    this.popup = introPopupHtml();
    this.render();
  },
  beginGame(){
    this.settings = defaultSettings();
    this.popup = null;
    this.newGame();
  },
  showSettings(){
    this.pendingSettings = this.settings? {...this.settings} : defaultSettings();
    this.popup = settingsPopupHtml(this.pendingSettings);
    this.render();
  },
  setSetting(key, value){
    if(!this.pendingSettings) this.pendingSettings = defaultSettings();
    this.pendingSettings[key] = value;
    this.popup = settingsPopupHtml(this.pendingSettings);
    this.render();
  },
  confirmSettings(){
    this.settings = this.pendingSettings? {...this.pendingSettings} : defaultSettings();
    this.pendingSettings = null;
    this.popup = null;
    this.newGame();
  },

  newGame(){
    if(!this.settings) this.settings = defaultSettings();
    const s = this.settings;
    this.scores=[s.startingScore, s.startingScore, s.startingScore, s.startingScore];
    this.log=[];
    this.lastRoundResult = undefined;
    this.roundsPlayed = 0;
    this.gameOver = false;
    this.gameOverReason = null;
    this.popup = null;
    const laps = s.maxLaps? `最大${s.maxLaps}巡` : '巡数無制限';
    const refill = s.wallRefill? '捨て札補充あり' : '捨て札補充なし';
    const threshold = s.lapThresholdEnabled? '点数しばりあり' : '点数しばりなし';
    this.pushLog(`新しいゲームを開始しました。全員${s.startingScore.toLocaleString()}CFUからスタート、配牌5枚ずつ、山12枚です。（${laps}／${refill}／${threshold}）`);
    this.runOyaSlot();
  },

  runOyaSlot(){
    const finalOya = Math.floor(Math.random()*4);
    const totalSpins = 9;
    let spins = 0;
    const tick = ()=>{
      const settled = spins>=totalSpins;
      const showIdx = settled? finalOya : spins%4;
      this.popup = slotPopupHtml(PLAYER_NAMES[showIdx], settled);
      this.render();
      if(!settled){
        spins++;
        const delay = spins<=4? 260 : 260+(spins-4)*110;
        setTimeout(tick, delay);
      } else {
        this.oya = finalOya;
        this.pushLog(`🎰 スロットの結果、${PLAYER_NAMES[finalOya]}が起家（親）に決まりました！`);
        setTimeout(()=>{
          this.popup = null;
          this.render();
          this.startRound();
        }, 1200);
      }
    };
    tick();
  },

  startRound(){
    // 親の引き継ぎ判定（初回はスロットで決まった親をそのまま使う）
    if(this.lastRoundResult === 'draw'){
      this.oya = (this.oya+1)%4;
    } else if(typeof this.lastRoundResult === 'number'){
      if(this.lastRoundResult !== this.oya){
        this.oya = (this.oya+1)%4;
      }
      // 親が勝った場合（lastRoundResult === oya）はそのまま続投
    }
    this.lastRoundResult = null;

    const deck = shuffle(CARDS);
    this.hands = [deck.slice(0,5),deck.slice(5,10),deck.slice(10,15),deck.slice(15,20)];
    this.wall = deck.slice(20);
    this.pending = null;
    this.discardLog = [];
    this.deadPile = [];
    this.reached = [false,false,false,false];
    this.reachTarget = [null,null,null,null];
    this.openIds = [[],[],[],[]];
    this.lastDrawFrom = [null,null,null,null];
    this.reachArmed = false;
    this.pendingReachChoice = null;
    this.lastDraw = [null,null,null,null];
    this.popup = null;
    this.ronOffer = null;
    this.zoomOpen = false;
    this.zoomSelectedId = null;
    this.adviceUsedThisRound = false;
    this.adviceData = null;
    this.adviceOpen = false;
    this.redealUsedThisRound = false;
    this.turn = this.oya;
    this.turnsTaken = [0,0,0,0];
    this.turnsTaken[this.oya] = 1;
    this.phase = 'awaitAction';
    this.roundOver = false;
    this.pushLog(`--- ラウンド開始（親:${PLAYER_NAMES[this.oya]}／1巡目50CFU・2巡目30CFU・3巡目20CFU・4巡目以降は役のみでOK。ツモあがり・直前の人からの釣菌あがりはリーチ不要。リーチ中は離れた人からも釣菌可） ---`);
    this.setMsg(this.turn===0
      ? 'あなたの番です。山から引くか、釣菌してください。'
      : `${PLAYER_NAMES[this.turn]}（親）が考えています…`);
    this.render();
    this.maybeCpuTurn();
  },

  pushLog(text){
    this.log.push(text);
    if(this.log.length>60) this.log.shift();
  },
  setMsg(html){ this.msg = html; },

  /* ---- human / generic actions ---- */
  drawFromWall(){
    if(this.phase!=='awaitAction' || this.turn!==0) return;
    if(this.wall.length===0){ this.triggerDraw("wall"); return; }
    if(this.pending){ this.archivePending(); }
    const card = this.wall.pop();
    this.checkWallReplenish();
    this.hands[0].push(card);
    this.lastDraw[0] = 'wall';
    this.lastDrawFrom[0] = null;
    this.pushLog(`あなたは山から引きました。`);
    if(this.reached[0]){
      this.handleForcedAfterDraw(0, card, ()=>{ this.render(); });
      return;
    }
    this.reachArmed = false;
    this.phase='awaitDiscard';
    this.setMsg('捨てるカードをタップしてください。テンパイになるならリーチもできます。');
    this.render();
  },
  tsurikin(){
    if(this.phase!=='awaitAction' || this.turn!==0 || !this.pending) return;
    if(this.reached[0] && !this.pending.card.tags.includes(this.reachTarget[0])) return;
    const card = this.pending.card;
    const fromIdx = this.pending.by;
    const fromName = PLAYER_NAMES[fromIdx];
    this.hands[0].push(card);
    this.lastDraw[0] = 'tsurikin';
    this.lastDrawFrom[0] = fromIdx;
    this.openIds[0].push(card.id);
    this.pushLog(`あなたは${fromName}の捨てた「${card.name}」を釣菌しました！（この札は公開され、もう捨てられません）`);
    this.pending = null;
    this.removeFromDiscardLog(card.id);
    if(this.reached[0]){
      this.handleForcedAfterDraw(0, card, ()=>{ this.render(); });
      return;
    }
    this.reachArmed = false;
    this.phase='awaitDiscard';
    this.setMsg('捨てるカードをタップしてください。テンパイになるならリーチもできます。');
    this.render();
  },
  humanDiscard(cardId){
    if(this.phase!=='awaitDiscard' || this.turn!==0) return;
    if(this.openIds[0].includes(cardId)) return; // 公開済み(釣菌で取った)カードは捨てられない
    const idx = this.hands[0].findIndex(c=>c.id===cardId);
    if(idx<0) return;
    if(this.reachArmed && !this.reached[0] && this.scores[0]>=100){
      const card = this.hands[0][idx];
      const rest = this.hands[0].filter(c=>c.id!==cardId);
      const options = tenpaiYakuList(rest);
      if(options.length===0){
        // この捨て方ではどの役もテンパイにならない（無関係／全部完成済みなど）。捨てさせずに案内する。
        const bt = bestTarget(rest);
        if(bt.cnt>=5){
          this.setMsg(`<span class="win">🚩「${card.name}」を捨てると役が完成済みのままになるため、リーチにはなりません。</span>リーチをやめて、そのまま捨てて「あがり宣言」するか、別の札を選んでください。`);
        } else {
          this.setMsg(`<span class="win">🚩「${card.name}」を捨ててもテンパイにならないため、リーチにはなりません。</span>別の札を選ぶか、リーチをやめてください。`);
        }
        this.render();
        return;
      }
      if(options.length===1){
        this.executeReachDiscard(cardId, options[0]);
        return;
      }
      // テンパイになる役が複数ある場合は、どれを狙うか選んでもらう
      this.pendingReachChoice = {cardId, options};
      this.popup = reachChoicePopupHtml(card.name, options);
      this.render();
      return;
    }
    this.reachArmed = false;
    const [card] = this.hands[0].splice(idx,1);
    this.pending = {card, by:0};
    this.discardLog.push({card, by:0});
    this.pushLog(`あなたは「${card.name}」を捨てました。`);
    this.render();
    this.processDiscard(card, 0, ()=>{
      this.phase='postDiscard';
      const lap = this.turnsTaken[0] || 1;
      this.setMsg(`役が完成していれば「あがり宣言」を（${lapThresholdLabel(lap)}）。なければ「次の人へ」進めてください。`);
      this.render();
    });
  },
  executeReachDiscard(cardId, option){
    // option: {key, label, pts} テンパイ対象として確定した役
    const idx = this.hands[0].findIndex(c=>c.id===cardId);
    if(idx<0) return;
    const [card] = this.hands[0].splice(idx,1);
    this.pending = {card, by:0};
    this.discardLog.push({card, by:0});
    this.reached[0] = true;
    this.reachTarget[0] = option.key;
    this.scores[0] -= 100;
    this.reachArmed = false;
    this.pendingReachChoice = null;
    this.pushLog(`🚩 あなたは「${card.name}」を捨ててリーチしました！（「${option.label}」待ち・100CFU供託）`);
    this.popup = reachPopupHtml('あなた');
    this.render();
    setTimeout(()=>{ this.popup = null; this.render(); }, 900);
    this.processDiscard(card, 0, ()=>{
      this.phase='postDiscard';
      this.setMsg(`🚩 リーチ中です。「${option.label}」待ちです。「次の人へ」進めてください。`);
      this.render();
    });
  },
  chooseReachTarget(key){
    const pc = this.pendingReachChoice;
    if(!pc) return;
    const option = pc.options.find(o=>o.key===key);
    if(!option) return;
    this.popup = null;
    this.executeReachDiscard(pc.cardId, option);
  },
  cancelReachChoice(){
    this.pendingReachChoice = null;
    this.popup = null;
    this.render();
  },
  forcedDiscard(p, cardId, note){
    const idx = this.hands[p].findIndex(c=>c.id===cardId);
    if(idx<0) return;
    const [card] = this.hands[p].splice(idx,1);
    this.pending = {card, by:p};
    this.discardLog.push({card, by:p});
    this.pushLog(`${PLAYER_NAMES[p]}は「${card.name}」を捨てました。${note||''}`);
    this.phase='postDiscard';
  },
  handleForcedAfterDraw(p, drawnCard, resumeFn){
    const target = this.reachTarget[p];
    const oldLeftover = this.hands[p].find(c => c.id!==drawnCard.id && !c.tags.includes(target) && !this.openIds[p].includes(c.id));
    let discardedCard;
    if(oldLeftover && drawnCard.tags.includes(target)){
      discardedCard = oldLeftover;
      this.forcedDiscard(p, oldLeftover.id, '(リーチ中・自動)');
    } else {
      // 待ちの種が無い（=既に役は完成しているが点数不足等で確定できていない）場合は、
      // 引いた札をそのまま捨てて手を崩さない
      discardedCard = drawnCard;
      this.forcedDiscard(p, drawnCard.id, '(リーチ中・自動)');
    }
    if(p===0){
      const lap = this.turnsTaken[0] || 1;
      this.setMsg(`🚩 リーチ中のため自動で捨てました。役が完成していれば「あがり宣言」を（${lapThresholdLabel(lap)}）。`);
    }
    this.render();
    this.processDiscard(discardedCard, p, resumeFn);
  },

  /* ---- リーチ中は「どこからでも釣菌」できる仕組み ---- */
  checkRonClaims(discardedCard, discarderIdx){
    const order = [];
    for(let step=1; step<=3; step++){
      const p = (discarderIdx+step)%4;
      if(!this.reached[p]) continue;
      const target = this.reachTarget[p];
      if(!discardedCard.tags.includes(target)) continue;
      const oldLeftover = this.hands[p].find(c=>!c.tags.includes(target) && !this.openIds[p].includes(c.id));
      if(!oldLeftover) continue; // 既に完成している等、想定外のケースはスキップ
      const simulatedHand = this.hands[p].filter(c=>c.id!==oldLeftover.id).concat([discardedCard]);
      const achieved = achievedYaku(simulatedHand);
      const lap = this.turnsTaken[p] || 1;
      const threshold = lapThreshold(lap);
      const qualifying = achieved.filter(y=>y.pts>=threshold);
      if(qualifying.length>0) order.push(p);
    }
    return order;
  },
  processDiscard(card, discarderIdx, resumeFn){
    // 捨てられた直後、リーチ中の他プレイヤーが「どこからでも釣菌」できるか判定する
    if(this.pending && this.pending.card && this.pending.card.id===card.id && this.pending.by===discarderIdx){
      const claimants = this.checkRonClaims(card, discarderIdx);
      if(claimants.length>0){
        this.attemptRonClaim(claimants, card, discarderIdx, resumeFn);
        return;
      }
    }
    resumeFn();
  },
  attemptRonClaim(claimants, card, discarderIdx, resumeFn){
    if(claimants.length===0){ resumeFn(); return; }
    const p = claimants[0];
    const rest = claimants.slice(1);
    if(p===0){
      this.ronOffer = {card, discarderIdx, resumeFn, rest};
      this.pushLog(`🎣 ${PLAYER_NAMES[discarderIdx]}が捨てた「${card.name}」はあなたの待ち牌です！`);
      this.setMsg(`🎣 ${PLAYER_NAMES[discarderIdx]}が捨てた「${card.name}」で上がれます。釣菌してあがりますか？`);
      this.render();
    } else {
      const target = this.reachTarget[p];
      const oldLeftover = this.hands[p].find(c=>!c.tags.includes(target) && !this.openIds[p].includes(c.id));
      this.hands[p] = this.hands[p].filter(c=>c.id!==oldLeftover.id).concat([card]);
      this.deadPile.push(oldLeftover);
      this.pending = null;
      this.removeFromDiscardLog(card.id);
      this.lastDraw[p] = 'tsurikin';
      this.lastDrawFrom[p] = discarderIdx;
      this.openIds[p].push(card.id);
      this.pushLog(`🎣 ${PLAYER_NAMES[p]}が${PLAYER_NAMES[discarderIdx]}の捨てた「${card.name}」を離れた場所から釣菌しました！（公開されます）`);
      this.render();
      setTimeout(()=>{
        const won = this.declareWin(p);
        if(!won){
          this.attemptRonClaim(rest, card, discarderIdx, resumeFn);
        }
      }, 550);
    }
  },
  respondRon(accept){
    const offer = this.ronOffer;
    if(!offer) return;
    this.ronOffer = null;
    if(accept){
      const target = this.reachTarget[0];
      const oldLeftover = this.hands[0].find(c=>!c.tags.includes(target) && !this.openIds[0].includes(c.id));
      this.hands[0] = this.hands[0].filter(c=>c.id!==oldLeftover.id).concat([offer.card]);
      this.deadPile.push(oldLeftover);
      this.pending = null;
      this.removeFromDiscardLog(offer.card.id);
      this.lastDraw[0] = 'tsurikin';
      this.lastDrawFrom[0] = offer.discarderIdx;
      this.openIds[0].push(offer.card.id);
      this.pushLog(`🎣 あなたは${PLAYER_NAMES[offer.discarderIdx]}の捨てた「${offer.card.name}」を離れた場所から釣菌しました！（公開されます）`);
      this.render();
      setTimeout(()=>{
        const won = this.declareWin(0);
        if(!won){
          this.attemptRonClaim(offer.rest, offer.card, offer.discarderIdx, offer.resumeFn);
        }
      }, 550);
    } else {
      this.pushLog('あなたは釣菌を見送りました。');
      this.attemptRonClaim(offer.rest, offer.card, offer.discarderIdx, offer.resumeFn);
    }
  },

  /* ---- 拡大機能 ---- */
  toggleZoom(){
    if(this.turn!==0 && !this.zoomOpen){
      // 自分の手番でなくても自分の手札は見られるので閲覧自体は許可する
    }
    this.zoomOpen = !this.zoomOpen;
    if(!this.zoomOpen) this.zoomSelectedId = null;
    this.render();
  },
  selectZoomCard(cardId){
    this.zoomSelectedId = (this.zoomSelectedId===cardId)? null : cardId;
    this.render();
  },
  closeZoom(){
    this.zoomOpen = false;
    this.zoomSelectedId = null;
    this.render();
  },

  /* ---- アドバイス機能 ---- */
  giveAdvice(){
    if(this.turn!==0 || this.roundOver || this.ronOffer) return;
    if(this.adviceUsedThisRound){
      this.setMsg('💡 アドバイスは1ラウンドにつき1回までです。');
      this.render();
      return;
    }
    const hand = this.hands[0];
    if(hand.length<5){ return; }
    let discardSuggestion = null;
    let best;
    if(hand.length===6){
      let bestAfter=null, bestIdx=-1;
      hand.forEach((c,idx)=>{
        const rest = hand.filter((_,i)=>i!==idx);
        const bt = bestTarget(rest);
        if(!bestAfter || bt.cnt>bestAfter.cnt || (bt.cnt===bestAfter.cnt && bt.pts>bestAfter.pts)){
          bestAfter=bt; bestIdx=idx;
        }
      });
      discardSuggestion = hand[bestIdx];
      best = bestAfter;
    } else {
      best = bestTarget(hand);
    }
    const need = Math.max(0, 5-best.cnt);
    const lap = this.turnsTaken[0] || 1;
    const threshold = lapThreshold(lap);
    this.adviceUsedThisRound = true;
    this.adviceData = {best, discardSuggestion, need, lap, threshold};
    this.adviceOpen = true;
    this.pushLog('💡 アドバイスを確認しました。');
    this.render();
  },
  closeAdvice(){
    this.adviceOpen = false;
    this.render();
  },

  /* ---- 配り直し（親のみ・1ラウンド1回） ---- */
  canRedeal(){
    return this.oya===0 && !this.redealUsedThisRound && this.turn===0
      && this.phase==='awaitAction' && this.discardLog.length===0 && !this.roundOver;
  },
  redeal(){
    if(!this.canRedeal()) return;
    this.redealUsedThisRound = true;
    const deck = shuffle(CARDS);
    this.hands = [deck.slice(0,5),deck.slice(5,10),deck.slice(10,15),deck.slice(15,20)];
    this.wall = deck.slice(20);
    this.pending = null;
    this.discardLog = [];
    this.deadPile = [];
    this.reached = [false,false,false,false];
    this.reachTarget = [null,null,null,null];
    this.openIds = [[],[],[],[]];
    this.lastDrawFrom = [null,null,null,null];
    this.reachArmed = false;
    this.pendingReachChoice = null;
    this.lastDraw = [null,null,null,null];
    this.pushLog('🔄 親（あなた）が配り直しを行いました。');
    this.setMsg('配り直しました。あなたの番です。山から引くか、釣菌してください。');
    this.render();
  },
  toggleReachArm(){
    if(this.phase!=='awaitDiscard' || this.turn!==0) return;
    if(this.reached[0] || this.scores[0]<100) return;
    this.reachArmed = !this.reachArmed;
    this.render();
  },
  checkGameOver(){
    const bustedIdx = this.scores.findIndex(s=>s<=0);
    if(bustedIdx>=0){
      this.gameOver = true;
      this.phase = 'gameOver';
      this.gameOverReason = `${PLAYER_NAMES[bustedIdx]}の持ち点が0CFU以下になったため、ここでゲーム終了です。`;
      return true;
    }
    const maxRounds = (this.settings && this.settings.maxRounds) || 50;
    if((this.roundsPlayed||0) >= maxRounds){
      this.gameOver = true;
      this.phase = 'gameOver';
      this.gameOverReason = `${maxRounds}ラウンドに達したため、その時点の最高所持者の優勝としてゲーム終了です。`;
      return true;
    }
    return false;
  },
  declareWin(playerIdx){
    const hand = this.hands[playerIdx];
    const achieved = achievedYaku(hand);
    const lap = this.turnsTaken[playerIdx] || 1;
    const threshold = lapThreshold(lap);
    const qualifying = achieved.filter(y => y.pts >= threshold);
    if(qualifying.length===0){
      if(playerIdx===0){
        if(achieved.length>0){
          this.pushLog(`あがり宣言 → 役はありますが点数が足りません（${lapThresholdLabel(lap)}）。`);
          this.setMsg(`<span class="win">役はありますが点数不足です。</span>現在${lapThresholdLabel(lap)}。`);
        } else {
          this.pushLog('あがり宣言 → 役はまだ完成していません。');
          this.setMsg('<span class="win">役が完成していません。</span>もう一度確認してください。');
        }
        this.render();
      }
      return false;
    }
    const isTsurikinWin = (this.lastDraw[playerIdx] === 'tsurikin');
    const best = qualifying.reduce((a,b)=> b.pts>a.pts? b:a);
    const isOya = (playerIdx === this.oya);
    const tsumoBonus = isTsurikinWin? 0 : 100;
    let perPayment = best.pts + tsumoBonus;
    if(isOya) perPayment *= 2;

    // ---- 基本の精算（ツモ＝全員から／釣菌＝捨てた本人のみから） ----
    let basePaid = 0;
    if(isTsurikinWin){
      const discarderIdx = this.lastDrawFrom[playerIdx];
      if(discarderIdx!==null && discarderIdx!==undefined && discarderIdx!==playerIdx){
        this.scores[discarderIdx] -= perPayment;
        basePaid = perPayment;
      }
    } else {
      for(let k=0;k<4;k++){
        if(k===playerIdx) continue;
        this.scores[k] -= perPayment;
        basePaid += perPayment;
      }
    }
    this.scores[playerIdx] += basePaid;

    // ---- リーチ供託金の精算 ----
    let reachBonus = 0;
    if(this.reached[playerIdx]){
      reachBonus += 100; // 自分が出した供託金が戻る
      for(let k=0;k<4;k++){
        if(k===playerIdx) continue;
        reachBonus += 100;
        if(!this.reached[k]){
          this.scores[k] -= 100; // 未リーチの相手からは新たに徴収
        }
        // 相手がリーチ済みなら、その人の供託金をそのまま回収（二重取りしない）
      }
      this.scores[playerIdx] += reachBonus;
    } else {
      // 自分はリーチしていない＝場の供託金はそのまま出した本人に返却
      for(let k=0;k<4;k++){
        if(this.reached[k]) this.scores[k] += 100;
      }
    }

    this.roundOver = true;
    this.phase = 'roundEnd';
    this.lastRoundResult = playerIdx;
    this.roundsPlayed = (this.roundsPlayed||0) + 1;
    const nm = PLAYER_NAMES[playerIdx];
    const sourceLabel = isTsurikinWin? '釣菌あがり' : 'ツモあがり';

    let yakuNote = '';
    if(achieved.length>1){
      const names = achieved.map(y=>y.label).join('と');
      yakuNote = `${names}が揃っていますが、最も点数の高い「${best.label}」が採用されます。`;
    }

    const totalGain = basePaid + reachBonus;
    const parts = [`「${best.label}」${best.pts}CFU`];
    if(tsumoBonus>0) parts.push(`ツモ+${tsumoBonus}`);
    if(isOya) parts.push('親2倍');
    if(reachBonus>0) parts.push(`リーチ供託+${reachBonus}`);
    const breakdown = parts.join(' ／ ');
    this.pushLog(`🏆 ${nm}が${sourceLabel}！ 上がり役：${best.label}${yakuNote? '　'+yakuNote : ''} ${breakdown} → 合計+${totalGain}CFU（${lap}巡目）`);
    this.popup = winPopupHtml(nm, best.label, totalGain, breakdown + (yakuNote? `<br><span style="font-size:11px; color:#7C8A78;">${yakuNote}</span>` : ''));
    this.render();

    // 精算が終わったのでリーチ状態をリセット
    this.reached = [false,false,false,false];
    this.reachTarget = [null,null,null,null];

    const overNow = this.checkGameOver();
    setTimeout(()=>{
      this.popup = overNow? finalStandingsPopupHtml(this.scores, this.gameOverReason) : standingsPopupHtml(this.scores);
      this.render();
      if(!overNow){
        setTimeout(()=>{
          this.popup = null;
          this.setMsg(`<span class="win">🏆 ${nm}の${sourceLabel}！「${best.label}」 合計+${totalGain}CFU</span>`);
          this.render();
        }, 1000);
      }
    }, 1000);
    return true;
  },
  endTurn(){
    if(this.phase!=='postDiscard') return;
    this.advanceTurn();
  },
  advanceTurn(){
    this.turn = (this.turn+1)%4;
    if(this.wall.length===0 && !this.pending){
      this.triggerDraw('wall');
      return;
    }
    this.turnsTaken[this.turn] = (this.turnsTaken[this.turn]||0) + 1;
    const maxLaps = this.settings? this.settings.maxLaps : 10;
    if(maxLaps && this.turnsTaken[this.turn] > maxLaps){
      this.triggerDraw('maxlaps');
      return;
    }
    this.phase='awaitAction';
    const lap = this.turnsTaken[this.turn];
    this.setMsg(this.turn===0
      ? `あなたの番です（${lapThresholdLabel(lap)}）。山から引くか、釣菌してください。`
      : `${PLAYER_NAMES[this.turn]}が考えています…（${lap}巡目）`);
    this.render();
    this.maybeCpuTurn();
  },
  archivePending(){
    // 取られなかった捨て札は「捨て札の山」に積まれ、後で山が1枚になったら補充に使われる
    if(this.pending) this.deadPile.push(this.pending.card);
    this.pending = null;
  },
  removeFromDiscardLog(cardId){
    // 釣菌などで手札に戻ったカードは、もう「捨て札」ではないので表示ログから消す
    for(let i=this.discardLog.length-1; i>=0; i--){
      if(this.discardLog[i].card.id === cardId){
        this.discardLog.splice(i,1);
        break;
      }
    }
  },
  checkWallReplenish(){
    if(this.settings && this.settings.wallRefill===false) return; // 「捨て札を山に戻さない」設定では補充しない
    if(this.wall.length===1 && this.deadPile.length>0){
      const recycled = shuffle(this.deadPile);
      this.wall = [...recycled, ...this.wall]; // 残り1枚の下に補充（その1枚が先に引かれる）
      this.pushLog(`山札が残り1枚になったため、捨て札${recycled.length}枚をシャッフルして山の下に補充しました。`);
      this.deadPile = [];
    }
  },
  triggerDraw(reason){
    // 流局：供託中のリーチ金は出した本人にそのまま返却する
    for(let k=0;k<4;k++){
      if(this.reached[k]) this.scores[k] += 100;
    }
    this.reached = [false,false,false,false];
    this.reachTarget = [null,null,null,null];
    this.roundsPlayed = (this.roundsPlayed||0) + 1;
    const reasonText = reason==='maxlaps'
      ? `最大巡数（${this.settings? this.settings.maxLaps : 10}巡）に達したため流局です（供託中のリーチ金は返却されました）。`
      : '山札が尽きました。流局です（供託中のリーチ金は返却されました）。';
    this.pushLog(reasonText);
    this.phase='roundEnd';
    this.roundOver=true;
    this.lastRoundResult='draw';
    const overNow = this.checkGameOver();
    if(overNow){
      this.popup = finalStandingsPopupHtml(this.scores, this.gameOverReason);
      this.setMsg('流局でゲーム終了です。');
    } else {
      this.setMsg('流局です。次のラウンドへ進みましょう。');
    }
    this.render();
  },

  /* ---- CPU AI ---- */
  maybeCpuTurn(){
    if(this.roundOver) return;
    if(this.turn===0) return;
    const p = this.turn;
    setTimeout(()=>this.cpuActDraw(p), 650);
  },
  cpuActDraw(p){
    if(this.roundOver) return;
    const hand = this.hands[p];

    if(this.reached[p]){
      // リーチ中：手なりは固定。取れば「実際に上がれる」時だけ釣菌、それ以外は山から引いて自動で捨てる
      let drawnCard, useTsurikin=false;
      if(this.pending && this.pending.card.tags.includes(this.reachTarget[p])){
        const target = this.reachTarget[p];
        const oldLeftover = this.hands[p].find(c=>!c.tags.includes(target) && !this.openIds[p].includes(c.id));
        if(oldLeftover){
          const simulatedHand = this.hands[p].filter(c=>c.id!==oldLeftover.id).concat([this.pending.card]);
          const achieved = achievedYaku(simulatedHand);
          const lap = this.turnsTaken[p] || 1;
          const threshold = lapThreshold(lap);
          const qualifying = achieved.filter(y=>y.pts>=threshold);
          if(qualifying.length>0) useTsurikin = true;
        }
      }
      if(useTsurikin){
        drawnCard = this.pending.card;
        const fromIdx = this.pending.by;
        const fromName = PLAYER_NAMES[fromIdx];
        hand.push(drawnCard);
        this.lastDraw[p] = 'tsurikin';
        this.lastDrawFrom[p] = fromIdx;
        this.openIds[p].push(drawnCard.id);
        this.pushLog(`${PLAYER_NAMES[p]}は${fromName}の捨てた「${drawnCard.name}」を釣菌しました。（公開されます）`);
        this.pending = null;
        this.removeFromDiscardLog(drawnCard.id);
      } else {
        if(this.pending) this.archivePending();
        if(this.wall.length===0){
          this.triggerDraw("wall");
          return;
        }
        drawnCard = this.wall.pop();
        this.checkWallReplenish();
        hand.push(drawnCard);
        this.lastDraw[p] = 'wall';
        this.lastDrawFrom[p] = null;
        this.pushLog(`${PLAYER_NAMES[p]}は山から引きました。`);
      }
      this.handleForcedAfterDraw(p, drawnCard, ()=>{
        setTimeout(()=>{
          const won = this.declareWin(p);
          if(!won){ this.advanceTurn(); }
        }, 550);
      });
      return;
    }

    const curBest = bestTarget(hand);
    let useTsurikin=false;
    if(this.pending){
      const candidate = hand.concat([this.pending.card]);
      let bestAfter=null;
      candidate.forEach((c,idx)=>{
        const rest = candidate.filter((_,i)=>i!==idx);
        const bt = bestTarget(rest);
        if(!bestAfter || bt.cnt>bestAfter.cnt || (bt.cnt===bestAfter.cnt && bt.pts>bestAfter.pts)){
          bestAfter = bt;
        }
      });
      if(bestAfter.cnt > curBest.cnt || (bestAfter.cnt===curBest.cnt && bestAfter.pts>curBest.pts && bestAfter.cnt>=3)){
        useTsurikin = true;
      }
    }
    if(useTsurikin){
      const card = this.pending.card;
      const fromIdx = this.pending.by;
      const fromName = PLAYER_NAMES[fromIdx];
      hand.push(card);
      this.lastDraw[p] = 'tsurikin';
      this.lastDrawFrom[p] = fromIdx;
      this.openIds[p].push(card.id);
      this.pushLog(`${PLAYER_NAMES[p]}は${fromName}の捨てた「${card.name}」を釣菌しました。（公開されます）`);
      this.pending = null;
      this.removeFromDiscardLog(card.id);
    } else {
      if(this.pending) this.archivePending();
      if(this.wall.length===0){
        this.triggerDraw("wall");
        return;
      }
      const card = this.wall.pop();
      this.checkWallReplenish();
      hand.push(card);
      this.lastDraw[p] = 'wall';
      this.lastDrawFrom[p] = null;
      this.pushLog(`${PLAYER_NAMES[p]}は山から引きました。`);
    }
    this.setMsg(`${PLAYER_NAMES[p]}が捨て札を選んでいます…`);
    this.render();
    setTimeout(()=>this.cpuActDiscard(p), 650);
  },
  cpuActDiscard(p){
    if(this.roundOver) return;
    const hand = this.hands[p]; // length 6
    const openIds = this.openIds[p];
    const candidateIdxs = [];
    hand.forEach((c,idx)=>{ if(!openIds.includes(c.id)) candidateIdxs.push(idx); });
    if(candidateIdxs.length===0){
      // 全カードが公開済みで捨てられない（理論上ほぼ起こらない）安全策
      this.advanceTurn();
      return;
    }

    const lap = this.turnsTaken[p] || 1;
    const threshold = lapThreshold(lap);

    // ① まず、その場であがれる捨て方があるか確認（最優先）
    let winIdx=-1, winYaku=null;
    candidateIdxs.forEach(idx=>{
      const rest = hand.filter((_,i)=>i!==idx);
      const achieved = achievedYaku(rest).filter(y=>y.pts>=threshold);
      if(achieved.length>0){
        const best = achieved.reduce((a,b)=> b.pts>a.pts? b:a);
        if(!winYaku || best.pts>winYaku.pts){ winYaku=best; winIdx=idx; }
      }
    });

    let bestRemoveIdx, declaringReach=false, reachOption=null;

    if(winIdx>=0){
      bestRemoveIdx = winIdx;
    } else {
      // ② あがれない場合は、テンパイになる役（一致枚数が多い役の陰に隠れているものも含め全て）の中から
      //    一番点数の高いものを探してリーチを狙う
      let bestReachIdx=-1, bestReachOption=null;
      if(!this.reached[p] && this.scores[p]>=100){
        candidateIdxs.forEach(idx=>{
          const rest = hand.filter((_,i)=>i!==idx);
          const options = tenpaiYakuList(rest); // pts降順ソート済み
          if(options.length>0){
            const top = options[0];
            if(!bestReachOption || top.pts>bestReachOption.pts){
              bestReachOption = top; bestReachIdx = idx;
            }
          }
        });
      }
      if(bestReachIdx>=0){
        bestRemoveIdx = bestReachIdx;
        declaringReach = true;
        reachOption = bestReachOption;
      } else {
        // ③ どちらも狙えない場合は、従来通り「一致枚数が多い役」を維持する捨て方を選ぶ
        let ba=null, bi=-1;
        candidateIdxs.forEach(idx=>{
          const rest = hand.filter((_,i)=>i!==idx);
          const bt = bestTarget(rest);
          if(!ba || bt.cnt>ba.cnt || (bt.cnt===ba.cnt && bt.pts>ba.pts)){
            ba=bt; bi=idx;
          }
        });
        bestRemoveIdx = bi;
      }
    }

    const [discarded] = hand.splice(bestRemoveIdx,1);
    this.pending = {card:discarded, by:p};
    this.discardLog.push({card:discarded, by:p});

    if(declaringReach){
      this.reached[p] = true;
      this.reachTarget[p] = reachOption.key;
      this.scores[p] -= 100;
      this.pushLog(`🚩 ${PLAYER_NAMES[p]}は「${discarded.name}」を捨ててリーチしました！（「${reachOption.label}」待ち・100CFU供託）`);
      this.popup = reachPopupHtml(PLAYER_NAMES[p]);
      this.render();
      setTimeout(()=>{ this.popup = null; this.render(); }, 900);
    } else {
      this.pushLog(`${PLAYER_NAMES[p]}は「${discarded.name}」を捨てました。`);
      this.render();
    }

    this.processDiscard(discarded, p, ()=>{
      setTimeout(()=>{
        const won = this.declareWin(p);
        if(!won){
          this.advanceTurn();
        }
      }, 550);
    });
  },

  /* ---------------- render ---------------- */
  render(){
    // scoreboard
    const sb = document.getElementById('scoreboard');
    sb.innerHTML = PLAYER_NAMES.map((nm,i)=>`
      <div class="score-card${this.turn===i && !this.roundOver? ' active':''}">
        <div class="nm">${nm}${i===0?' 👤':' 🤖'}${this.reached[i]? ' 🚩':''}${this.oya===i? ' 👑':''}</div>
        <div class="pt">${this.scores[i].toLocaleString()}<span style="font-size:10px; font-weight:600;"> CFU</span></div>
        ${this.turn===i && !this.roundOver? `<div class="tag">手番・${this.turnsTaken[i]||1}巡目</div>`:(this.reached[i] && !this.roundOver? '<div class="tag">リーチ中</div>':(this.oya===i? '<div class="tag">親</div>':''))}
      </div>`).join('');

    // seats highlight
    [0,1,2,3].forEach(i=>{
      const seat = document.getElementById('seat-'+i);
      if(seat) seat.classList.toggle('turn', this.turn===i && !this.roundOver);
    });

    // cpu hands（釣菌で公開された札は常時オープン。それ以外は裏向き、ラウンド終了時は全公開）
    [1,2,3].forEach(i=>{
      const el = document.getElementById('hand-'+i);
      el.innerHTML = this.hands[i].map(c=>{
        const isOpen = this.openIds[i].includes(c.id);
        if(this.roundOver) return cardHtml(c,{small:true, openLocked:isOpen});
        if(isOpen) return cardHtml(c,{small:true, openLocked:true});
        return `<div class="card-back"></div>`;
      }).join('');
    });

    // your hand
    const yourHandEl = document.getElementById('hand-0');
    const canDiscard = this.phase==='awaitDiscard' && this.turn===0;
    yourHandEl.innerHTML = this.hands[0].map(c=>{
      const isOpen = this.openIds[0].includes(c.id);
      if(isOpen) return cardHtml(c,{openLocked:true});
      let titleOverride = null;
      if(canDiscard && this.reachArmed){
        const rest = this.hands[0].filter(x=>x.id!==c.id);
        const options = tenpaiYakuList(rest);
        if(options.length===0){
          const bt = bestTarget(rest);
          titleOverride = bt.cnt>=5
            ? 'この札を捨てると役が完成済みのままになるため、リーチにはなりません（タップすると詳しく案内します）。'
            : 'この札を捨ててもテンパイにならないため、リーチにはなりません（タップすると詳しく案内します）。';
        } else if(options.length===1){
          titleOverride = `この札を捨てると「${options[0].label}」待ちでリーチできます（タップでリーチ）。`;
        } else {
          titleOverride = `この札を捨てると複数の役が同時にテンパイになります（タップで選択）：${options.map(o=>o.label).join('／')}`;
        }
      }
      return cardHtml(c,{clickable:canDiscard, onclick: canDiscard? `App.humanDiscard(${c.id})`:null, titleOverride});
    }).join('');

    // wall + discard feed
    document.getElementById('wall-count').textContent = this.wall.length;
    const feed = document.getElementById('discard-feed');
    const recent = this.discardLog.slice(-4);
    feed.innerHTML = recent.map((d,idx)=>{
      const isPending = this.pending && d.card.id===this.pending.card.id && idx===recent.length-1;
      return `<div class="${isPending?'pending-card':''}">
        ${isPending? `<div class="pending-tag">釣菌可</div>`:''}
        ${cardHtml(d.card,{small:true})}
      </div>`;
    }).join('') || '<span style="color:#cfd8c9; font-size:11px;">捨て札なし</span>';

    // message
    document.getElementById('msg').innerHTML = this.msg || '';

    // popup overlay (リーチ／あがり／順位)
    document.getElementById('popup-root').innerHTML = this.popup || '';

    // utility toolbar（拡大・アドバイス・配り直し）
    const util = document.getElementById('util-row');
    if(util){
      const canAct = !this.popup && !this.ronOffer;
      let utilHtml = `<button class="util-btn" onclick="App.toggleZoom()" ${canAct? '':'disabled'}>🔍 拡大</button>`;
      utilHtml += `<button class="util-btn" onclick="App.giveAdvice()" ${(canAct && this.turn===0 && !this.roundOver && !this.adviceUsedThisRound)? '':'disabled'}>💡 アドバイス${this.adviceUsedThisRound? '（使用済）':''}</button>`;
      if(this.canRedeal()){
        utilHtml += `<button class="util-btn" onclick="App.redeal()" ${canAct? '':'disabled'} style="border-color:var(--gold); color:#B8852B;">🔄 配り直し（親）</button>`;
      }
      util.innerHTML = utilHtml;
    }

    // 拡大モーダル
    const modalRoot = document.getElementById('modal-root');
    if(modalRoot){
      if(this.zoomOpen){
        const cardsHtml = this.hands[0].map(c=>
          `<div class="zoom-card-wrap">${cardHtml(c,{clickable:true, onclick:`App.selectZoomCard(${c.id})`})}</div>`
        ).join('');
        let infoHtml = '手札のカードをタップすると、含まれる役が分かります。';
        if(this.zoomSelectedId!==null){
          const card = this.hands[0].find(c=>c.id===this.zoomSelectedId);
          if(card){
            const matchedYaku = YAKU.filter(y=>card.tags.includes(y.key)).sort((a,b)=>b.pts-a.pts);
            const list = matchedYaku.map(y=>`「${y.label}」(${y.pts}CFU)`).join('、');
            infoHtml = `<b>${card.name}</b>（${card.classification}）が含まれる役：<br>${list || 'なし'}`;
          }
        }
        modalRoot.innerHTML = `<div class="modal-overlay"><div class="modal-card">
          <h3>🔍 手札を拡大<button class="modal-close" onclick="App.closeZoom()">閉じる ✕</button></h3>
          <div class="zoom-grid">${cardsHtml}</div>
          <div class="zoom-info">${infoHtml}</div>
        </div></div>`;
      } else if(this.adviceOpen && this.adviceData){
        const d = this.adviceData;
        const needText = d.need===0
          ? 'すでに役が完成しています！'
          : `あと最低 <b>${d.need}回</b> の交換（ぴったりのカードを引く／釣菌する）で揃います。`;
        const discardText = d.discardSuggestion
          ? `おすすめの捨て札は <b>${d.discardSuggestion.name}</b> です。`
          : '';
        const thresholdText = d.threshold>0
          ? `現在${d.lap}巡目なので、上がるには${d.threshold}CFU以上の役が必要です。`
          : `現在${d.lap}巡目なので、役があればそのまま上がれます。`;
        modalRoot.innerHTML = `<div class="modal-overlay"><div class="modal-card">
          <h3>💡 アドバイス<button class="modal-close" onclick="App.closeAdvice()">閉じる ✕</button></h3>
          <div class="advice-highlight">
            <div class="advice-line">おすすめの役：<b>${d.best.label}</b>（${d.best.pts}CFU）</div>
            <div class="advice-line">${discardText}</div>
            <div class="advice-line">${needText}</div>
          </div>
          <div class="advice-line" style="color:#7C8A78; font-size:12px;">${thresholdText}</div>
          <div class="advice-line" style="color:#B8852B; font-size:11.5px; margin-top:6px;">※アドバイスは1ラウンドにつき1回までです。</div>
        </div></div>`;
      } else {
        modalRoot.innerHTML = '';
      }
    }

    // buttons
    const br = document.getElementById('btn-row');
    let html = '';
    if(this.ronOffer){
      html += `<button class="btn btn-gold" onclick="App.respondRon(true)">🎣 釣菌してあがる</button>`;
      html += `<button class="btn btn-outline" onclick="App.respondRon(false)">見送る</button>`;
    } else if(this.popup){
      // ポップアップ表示中は操作不可
      html = '';
    } else if(this.roundOver){
      html += `<button class="btn btn-gold" onclick="App.startRound()">▶ 次のラウンドへ</button>`;
    } else if(this.turn===0){
      if(this.phase==='awaitAction'){
        const tsurikinDisabled = !this.pending || (this.reached[0] && !this.pending.card.tags.includes(this.reachTarget[0]));
        html += `<button class="btn btn-primary" onclick="App.drawFromWall()" ${this.wall.length===0&&!this.pending?'disabled':''}>🀫 山から引く</button>`;
        html += `<button class="btn btn-outline" onclick="App.tsurikin()" ${tsurikinDisabled? 'disabled':''}>🎣 釣菌する${this.pending? `（前の人の「${this.pending.card.name}」）`:''}</button>`;
        if(this.hands[0].length===5){
          html += `<button class="btn btn-gold" onclick="App.declareWin(0)">🏆 あがり宣言</button>`;
        }
      } else if(this.phase==='awaitDiscard'){
        const canReachToggle = !this.reached[0] && this.scores[0]>=100;
        const lap0 = this.turnsTaken[0] || 1;
        const threshold0 = lapThreshold(lap0);
        const hasImmediateWin = this.hands[0].some(c=>{
          const rest = this.hands[0].filter(x=>x.id!==c.id);
          return achievedYaku(rest).some(y=>y.pts>=threshold0);
        });
        html += `<span style="font-size:12px;color:#7C8A78;align-self:center;">手札からカードをタップして捨ててください（6枚→5枚）</span>`;
        if(hasImmediateWin){
          html += `<span style="font-size:11px;color:#B8852B;align-self:center; flex-basis:100%;">💡 すでに役が完成しています。リーチせずそのまま捨てて「あがり宣言」してください。</span>`;
        }
        if(canReachToggle){
          html += `<button class="btn btn-outline${this.reachArmed? ' reach-armed':''}" onclick="App.toggleReachArm()" style="border-color:var(--gold); color:#B8852B;">🚩 ${this.reachArmed? 'リーチする札をタップ（解除）':'リーチして捨てる'}</button>`;
        }
      } else if(this.phase==='postDiscard'){
        html += `<button class="btn btn-gold" onclick="App.declareWin(0)">🏆 あがり宣言</button>`;
        html += `<button class="btn btn-outline" onclick="App.endTurn()">➡ 次の人へ</button>`;
      }
    } else {
      html += `<span style="font-size:12px;color:#7C8A78;align-self:center;">${PLAYER_NAMES[this.turn]}のターンです…</span>`;
    }
    br.innerHTML = html;

    // log
    const logEl = document.getElementById('log-list');
    logEl.innerHTML = this.log.slice(-30).map(l=>`<li>${l}</li>`).join('');
    logEl.scrollTop = logEl.scrollHeight;

    // yaku list (once)
    const yk = document.getElementById('yaku-list');
    if(!yk.dataset.filled){
      yk.innerHTML = YAKU.slice().sort((a,b)=>b.pts-a.pts).map(y=>`<li><span>${y.label}</span><b>${y.pts}</b></li>`).join('');
      yk.dataset.filled='1';
    }
  }
};

App.showIntro();
</script>
