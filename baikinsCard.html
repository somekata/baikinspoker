<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バイキンズ カード図鑑</title>
<style>
  :root {
    --bg: #f6f1e6;
    --fg: #000;
    --muted: #444;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "BIZ UDPGothic", "BIZ UDPゴシック", "Hiragino Sans", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  header { text-align: center; padding: 24px 16px 8px; }
  header h1 { margin: 0; font-size: clamp(20px, 4vw, 32px); }
  header p { margin: 6px 0 0; color: var(--muted); font-size: clamp(12px, 2vw, 16px); }

  /* 1段あたり4枚 */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(8px, 2vw, 20px);
    max-width: 1000px;
    margin: 0 auto;
    padding: 16px clamp(8px, 2vw, 20px) 32px;
  }
  .card { margin: 0; }
  .card a { display: block; text-decoration: none; color: inherit; }
  /* 4隅を丸く */
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    transition: transform .15s ease, box-shadow .15s ease;
    background: #ddd;
  }
  .card a:hover img, .card a:focus-visible img {
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(0,0,0,.3);
  }
  .card figcaption { margin-top: 6px; text-align: center; font-size: clamp(10px, 1.6vw, 15px); line-height: 1.35; }
  .card .no { color: var(--muted); font-size: .85em; }
  .card .sci { display: block; color: var(--muted); }
  @media (max-width: 560px) { .card .sci { display: none; } }

  /* ライトボックス */
  #lb {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,.82); padding: 16px;
  }
  #lb.open { display: flex; }
  #lb img {
    max-width: min(96vw, 1100px); max-height: 82vh; width: auto; height: auto;
    border-radius: 18px; background: #fff;
  }
  #lb .cap { color: #fff; margin-top: 10px; text-align: center; font-size: 16px; }
  #lb .cap i { color: #fff; }
  #lb button {
    position: absolute; border: 0; cursor: pointer; color: #000; background: rgba(255,255,255,.9);
    width: 48px; height: 48px; border-radius: 50%; font-size: 24px; line-height: 1;
  }
  #lb .close { top: 12px; right: 12px; }
  #lb .prev { left: 10px; top: 50%; transform: translateY(-50%); }
  #lb .next { right: 10px; top: 50%; transform: translateY(-50%); }

  footer {
    max-width: 1000px; margin: 0 auto; padding: 16px 20px 32px;
    border-top: 1px solid #c9bfa6; font-size: 14px; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1>バイキンズ カード図鑑</h1>
  <p>カードをクリックすると、表・裏の解説が開きます</p>
</header>

<main class="grid" id="grid"></main>

<div id="lb" role="dialog" aria-modal="true" aria-label="カード拡大表示">
  <button class="close" aria-label="閉じる">×</button>
  <button class="prev" aria-label="前のカード">‹</button>
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
  <button class="next" aria-label="次のカード">›</button>
</div>

<footer>
  <p>本テキストは AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。<br>
  二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。</p>
</footer>

<script>
  // 画像: img/sm-card-01.png 〜 sm-card-32.png（一覧用）
  //       img/img-card-01.png 〜 img-card-32.png（拡大用）
  const DIR = "img";
  const EXT = "png";

  // 並びはファイル番号（01〜32）に対応
  const cards = [
    { name: "ハイエンキューキン王", sci: "<i>Streptococcus pneumoniae</i>" },            // 01
    { name: "インフルエンザキンXV世女王", sci: "<i>Haemophilus influenzae</i>" },        // 02
    { name: "マイコプラズマ姫", sci: "<i>Mycoplasma pneumoniae</i>" },                  // 03
    { name: "レジオネラ爺や", sci: "<i>Legionella pneumophila</i>" },                   // 04
    { name: "ダイチョーキン", sci: "<i>Escherichia coli</i>" },                         // 05
    { name: "ベロダシ", sci: "EHEC" },                                                  // 06
    { name: "シゲ裸族", sci: "<i>Shigella</i>" },                                       // 07
    { name: "クレブシエ裸族", sci: "<i>Klebsiella</i>" },                               // 08
    { name: "ビブリ男コレラ", sci: "<i>Vibrio cholerae</i>" },                         // 09
    { name: "リョクノーキン", sci: "<i>Pseudomonas aeruginosa</i>" },                   // 10
    { name: "アシネトバクター", sci: "<i>Acinetobacter</i>" },                          // 11
    { name: "チフス和尚", sci: "<i>Salmonella</i> Typhi" },                             // 12
    { name: "クラミジア・ニューモニエ侯", sci: "<i>Chlamydia pneumoniae</i>" },         // 13
    { name: "クラミジア・シッタ氏", sci: "<i>Chlamydia psittaci</i>" },                 // 14
    { name: "ブドウキューキン族(黄色部族)", sci: "<i>Staphylococcus aureus</i>" },      // 15
    { name: "ケッカクキン", sci: "<i>Mycobacterium tuberculosis</i>" },                 // 16
    { name: "MAC", sci: "<i>Mycobacterium avium</i> complex" },                         // 17
    { name: "コクシジオイデス海賊王", sci: "<i>Coccidioides immitis</i>" },             // 18
    { name: "ヒストプラス魔王", sci: "<i>Histoplasma capsulatum</i>" },                 // 19
    { name: "パラコクシジオイデス", sci: "<i>Paracoccidioides brasiliensis</i>" },      // 20
    { name: "ミセス・ブラスト", sci: "<i>Blastomyces dermatitidis</i>" },               // 21
    { name: "タラロミセス・マルネッフェイ", sci: "<i>Talaromyces marneffei</i>" },      // 22
    { name: "クリプトコックス・ネオフォルマンス", sci: "<i>Cryptococcus neoformans</i>" }, // 23
    { name: "クリプトコックス・ガッティ", sci: "<i>Cryptococcus gattii</i>" },          // 24
    { name: "カンジダ", sci: "<i>Candida albicans</i>" },                               // 25
    { name: "アスペルギルス", sci: "<i>Aspergillus fumigatus</i>" },                    // 26
    { name: "コーボくん", sci: "<i>Saccharomyces cerevisiae</i>" },                     // 27
    { name: "こうじ君", sci: "<i>Aspergillus oryzae</i>" },                             // 28
    { name: "A軍連隊", sci: "<i>Streptococcus pyogenes</i>" },                          // 29
    { name: "B軍連隊", sci: "<i>Streptococcus agalactiae</i>" },                        // 30
    { name: "ディフィシル", sci: "<i>Clostridioides difficile</i>" },                   // 31
    { name: "タンソ", sci: "<i>Bacillus anthracis</i>" }                                // 32
  ];

  const pad = n => String(n).padStart(2, "0");
  const smPath  = i => `${DIR}/sm-card-${pad(i + 1)}.${EXT}`;
  const imgPath = i => `${DIR}/img-card-${pad(i + 1)}.${EXT}`;
  const stripTags = s => s.replace(/<[^>]+>/g, "");

  const grid = document.getElementById("grid");
  cards.forEach((c, i) => {
    const fig = document.createElement("figure");
    fig.className = "card";
    fig.innerHTML =
      `<a href="${imgPath(i)}" data-i="${i}">
         <img src="${smPath(i)}" alt="${c.name}（${stripTags(c.sci)}）" loading="lazy">
       </a>
       <figcaption><span class="no">${pad(i + 1)}</span> ${c.name}<span class="sci">${c.sci}</span></figcaption>`;
    grid.appendChild(fig);
  });

  const lb = document.getElementById("lb");
  const lbimg = document.getElementById("lbimg");
  const lbcap = document.getElementById("lbcap");
  let cur = 0;

  function show(i) {
    cur = (i + cards.length) % cards.length;
    const c = cards[cur];
    lbimg.src = imgPath(cur);
    lbimg.alt = `${c.name}（${stripTags(c.sci)}）`;
    lbcap.innerHTML = `${pad(cur + 1)} ${c.name} / ${c.sci}`;
    lb.classList.add("open");
  }
  const close = () => lb.classList.remove("open");

  grid.addEventListener("click", e => {
    const a = e.target.closest("a[data-i]");
    if (!a) return;
    e.preventDefault();
    show(+a.dataset.i);
  });
  lb.addEventListener("click", e => {
    if (e.target === lb || e.target.classList.contains("close")) close();
    else if (e.target.classList.contains("prev")) show(cur - 1);
    else if (e.target.classList.contains("next")) show(cur + 1);
  });
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
</script>
</body>
</html>
